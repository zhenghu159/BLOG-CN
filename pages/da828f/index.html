DOI: <a href="https://doi.org/10.1016/j.cell.2019.09.023" target="_blank" rel="noopener noreferrer">https://doi.org/10.1016/j.cell.2019.09.023<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>
Cite: Chen X, Sun YC, Zhan H, Kebschull JM, Fischer S, Matho K, Huang ZJ, Gillis J, Zador AM. High-Throughput Mapping of Long-Range Neuronal Projection Using In Situ Sequencing. Cell. 2019 Oct 17;179(3):772-786.e19.</p> <div class="custom-block note"><p class="custom-block-title">相关阅读</p> <p>微信公众号：<a href="https://mp.weixin.qq.com/s?__biz=MzkwMjM0MzA5MA==&amp;mid=2247483791&amp;idx=1&amp;sn=2cef59fd019430910b711bd8d03e5e04&amp;chksm=c0a7b152f7d038440cc57cd309a3e6cb7c57e05df386130fb0328681ee810a55f2c6955cd0eb&amp;token=549238884&amp;lang=zh_CN#rd" target="_blank" rel="noopener noreferrer">文献阅读：使用原位测序高通量绘制长程神经元投射<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></div> <p><strong>作者介绍：</strong></p> <table><thead><tr><th style="text-align:center;">Anthony Zador</th></tr></thead> <tbody><tr><td style="text-align:center;"><img src="https://www.cshl.edu/wp-content/uploads/2022/02/Anthony-Zador_profile.jpg" width="200"></td></tr> <tr><td style="text-align:center;">Cold Spring Harbor Laboratory</td></tr> <tr><td style="text-align:center;"><a href="mailto:zador@cshl.edu">zador@cshl.edu</a></td></tr></tbody></table> <h2 id="abstract"><a href="#abstract" class="header-anchor">#</a> Abstract</h2> <p>理解神经环路需要破译由空间组织、连接性、基因表达和其他属性定义的无数细胞类型之间的相互作用。解决这些细胞类型需要单神经元分辨率和高通量，这是一个与传统方法具有挑战性的结合。在这里，我们介绍了通过测序解析条形码结构 (barcoded anatomy resolved by sequencing，BARseq)，这是一种基于 RNA 条形码的多路方法，用于绘制单个大脑中数千个空间分辨神经元的投射，并将这些投射与基因或 Cre 表达等其他特性联系起来。利用 BARseq 将投射映射到小鼠听觉皮层中 11个区域的 3,579 个神经元，证实了投射神经元的三大类：端脑内（intratelencephalic，IT）、锥体束样（pyramidal tract-like，PT-like）和皮质丘脑（corticothalamic，CT）的层状组织。深入分析发现了一种投射类型，几乎只局限于转录定义的 IT 神经元的亚型。通过以高通量的细胞分辨率连接解剖学和转录组学方法，BARseq 可以潜在地揭示神经回路的结构和形成背后的组织原理。</p> <h2 id="results"><a href="#results" class="header-anchor">#</a> Results</h2> <h3 id="fig1-multiplexed-projection-mapping-using-in-situ-sequencing"><a href="#fig1-multiplexed-projection-mapping-using-in-situ-sequencing" class="header-anchor">#</a> Fig1. Multiplexed Projection Mapping Using In Situ Sequencing</h3> <p><img src="https://www.cell.com/cms/attachment/1b78fa3c-f355-43de-a457-7cabdd45b7da/gr1_lrg.jpg" alt="Fig1"></p> <div class="custom-block note"><p class="custom-block-title">Fig1. 使用原位测序的多重投射绘制</p> <p><strong>A.</strong> MAPseq (左) 和 BARseq (右) 的工作流程。<br> <strong>B.</strong> NGS 与 in situ sequencing 的比较。<br> <strong>C.</strong> in situ sequencing 和 杂交技术的比较。<br> <strong>D.</strong> GFP 和 Barcode 扩增子比较，说明Barcode能正常扩增。<br> <strong>E.</strong> 前四轮原位测序图像。</p></div> <h3 id="fig2-validation-of-barseq"><a href="#fig2-validation-of-barseq" class="header-anchor">#</a> Fig2. Validation of BARseq</h3> <p><img src="https://www.cell.com/cms/attachment/9a8d313d-1aec-4391-b407-b1b51609a279/gr2_lrg.jpg" alt="Fig2"></p> <div class="custom-block note"><p class="custom-block-title">Fig2. BARseq 的验证</p> <p><strong>A.</strong> GFP 和 Rolonies 成像图，左下角为 No Barcode 阴性对照。<br> <strong>B.</strong> 原位测序成像图。<br> <strong>C.</strong> 三个示例细胞的原位测序结果。<br> <strong>D.</strong> 每一轮四种碱基测序质量。<br> <strong>E.</strong> in situ sequences 和 random sequences 错配数对应细胞数，说明 barcode reads 不太可能是偶然的随机序列的假阳性匹配。<br> <strong>F.</strong> 一个示例，in situ sequences 和 random sequences 与它们最匹配的序列，红色表示不匹配。<br> <strong>G.</strong> CTB (cholera toxin subunit B, 霍乱毒素B亚基)，一种常见的逆行示踪剂。在 contralateral auditory cortex 注射 CTB，并在 ipsilateral auditory cortex 注射 barcode。<br> <strong>H.</strong> contralateral auditory cortex 的 barcodes (青色) 和 CTB (洋红色) 双色图像。<br> <strong>I.</strong> contralateral auditory cortex 中 CTB 标记神经元和 BARseq 标记神经元的Venn图。</p></div> <h3 id="fig3-correlating-gene-expression-and-projections-using-barseq"><a href="#fig3-correlating-gene-expression-and-projections-using-barseq" class="header-anchor">#</a> Fig3. Correlating Gene Expression and Projections Using BARseq</h3> <p><img src="https://www.cell.com/cms/attachment/b43775ba-d814-4019-9cad-5adff5b84472/gr3_lrg.jpg" alt="Fig3"></p> <div class="custom-block note"><p class="custom-block-title">Fig3. 使用 BARseq 关联基因表达和投射</p> <p><strong>A.</strong> 表达 Fezf2+ tdTomato 的细胞成像(左)、表达 GFP 的 barcoded 细胞成像(中)、合并图像(右)、原位测序不同轮成像(下)。<br> <strong>B.</strong> 所有 1,291 个 projection neurons 的投射模式(左)、72个 Fezf2+ neurons 的投射模式(右)。<br> <strong>C.</strong> 72个 Fezf2+ neurons 的细胞类型和  cortical depth 分布。<br> <strong>D.</strong> 同一样本 Slc17a7/Gad2 FISH(左) 和 不同轮原位测序图像(右)。<br> <strong>E.</strong> D中圈出来的三个细胞 Slc17a7/Gad2 表达情况和 barcode sequences。<br> <strong>F.</strong> 不同 Slc17a7/Gad2 表达模式下，有(Proj+)和无(Proj-)投射的细胞数目。<br> <strong>G.</strong> barcoded 和 non-barcoded neurons 平均基因表达量。</p></div> <h3 id="fig4-mapping-projections-of-the-auditory-cortex-using-barseq"><a href="#fig4-mapping-projections-of-the-auditory-cortex-using-barseq" class="header-anchor">#</a> Fig4. Mapping Projections of the Auditory Cortex Using BARseq</h3> <p><img src="https://www.cell.com/cms/attachment/2881bdcf-6b76-44e9-8f37-8481178163c7/gr4_lrg.jpg" alt="Fig4"></p> <div class="custom-block note"><p class="custom-block-title">Fig4. 使用 BARseq 绘制听觉皮层的投射</p> <p><strong>A.</strong> BARseq 测得的所有 barcodes 两两之间 hamming distance 直方图。<br> <strong>B.</strong> 所有 6,391个 projection neurons (1309 BARseq、 5,082 MAPseq) 投射模式。<br> <strong>C.</strong> BARseq 和  bulk GFP 投射强度(barcode分子数)相关性。<br> <strong>D.</strong> 每个 projection area 的  barcode counts 小提琴图。<br> <strong>E.</strong> 过滤后的二值化投射模式个数和最小的主要投射强度。<br> <strong>F.</strong> 不同投射个数的神经元细胞数目。<br> <strong>G.</strong> 二级投射与初级投射的强度比值对应的细胞比率。</p></div> <h3 id="fig5-the-laminar-organization-of-projection-neurons-in-the-auditory-cortex"><a href="#fig5-the-laminar-organization-of-projection-neurons-in-the-auditory-cortex" class="header-anchor">#</a> Fig5. The Laminar Organization of Projection Neurons in the Auditory Cortex</h3> <p><img src="https://www.cell.com/cms/attachment/3c885b02-bae3-461a-94b0-ba35b678f6c3/gr5_lrg.jpg" alt="Fig5"></p> <div class="custom-block note"><p class="custom-block-title">Fig5. 听觉皮层投射神经元的层状组织</p> <p><strong>A.</strong> 主要神经元类别的投射模式，黑色表示同侧投射，蓝色表示对侧投射，粗细表示强度。<br> <strong>B.</strong> 各个主要类群的分层分布情况。<br> <strong>C.</strong> 单细胞投射数据的层次聚类。<br> <strong>D.</strong> 投射神经元的 t-SNE。<br> <strong>E.</strong> 不同聚类分辨率下各类群分层位置情况。</p></div> <h3 id="fig6-subtypes-of-it-neurons-defined-by-gene-expression-in-the-auditory-cortex"><a href="#fig6-subtypes-of-it-neurons-defined-by-gene-expression-in-the-auditory-cortex" class="header-anchor">#</a> Fig6. Subtypes of IT Neurons Defined by Gene Expression in the Auditory Cortex</h3> <p><img src="https://www.cell.com/cms/attachment/58bf4dd6-dd01-4467-9f2c-2225dfdcb407/gr6_lrg.jpg" alt="Fig6"></p> <div class="custom-block note"><p class="custom-block-title">Fig6. 听觉皮层基因表达定义的 IT 神经元亚型</p> <p><strong>A.</strong> 735 个神经元的 scRNAseq。<br> <strong>B.</strong> 神经元基因表达的 t-SNE。<br> <strong>C.</strong> 与 Tasic et al. 视觉皮层单细胞类群的 MetaNeighbor 比较。<br> <strong>D.</strong> 投射对应基因表达热图。<br> <strong>E.</strong> 4个IT类群的分层情况。</p></div> <h3 id="fig7-projections-across-it-subtypes-defined-by-gene-expression"><a href="#fig7-projections-across-it-subtypes-defined-by-gene-expression" class="header-anchor">#</a> Fig7. Projections across IT Subtypes Defined by Gene Expression</h3> <p><img src="https://www.cell.com/cms/attachment/ee8a3236-7a57-43d5-87c4-ff74b09c1d0b/gr7_lrg.jpg" alt="Fig7"></p> <div class="custom-block note"><p class="custom-block-title">Fig7. 由基因表达定义的跨 IT 亚型的投射</p> <p><strong>A.</strong> ITi-Ctx 神经元在 4 个 IT 转录组类群中的占比情况。<br> <strong>B.</strong> 4 个 IT 转录组类群深层到浅层的细胞比率。<br> <strong>C.</strong> 4 个 IT 转录组类群同侧和对侧 barcode 强度。<br> <strong>D.</strong> 每个 IT 投射亚群中 4 个 IT 转录组类群的占比。<br> <strong>E.</strong> Cdh13+/- IT 类群 投射+/不投射- 到 AudC 的细胞数目。<br> <strong>F.</strong> 在所有 4 个 IT 转录组类群中都可以找到相同的投射亚型。</p></div></div></div>  <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=%E7%A5%9E%E7%BB%8F%E7%94%9F%E7%89%A9%E5%AD%A6" title="标签">#神经生物学</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/02/19, 20:54:06</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/037be6/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">文献阅读 --- Differences in neurotropism and neurotoxicity among retrograde viral tracers</div></a> <a href="/pages/afda58/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">文献阅读 --- BRICseq Bridges Brain-wide Interregional Connectivity to Neural Activity and Gene Expression in Single Animals</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
