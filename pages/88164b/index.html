DOI: <a href="https://doi.org/10.1038/nrn3586" target="_blank" rel="noopener noreferrer">https://doi.org/10.1038/nrn3586<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>
Cite: Greig, L., Woodworth, M., Galazo, M. et al. Molecular logic of neocortical projection neuron specification, development and diversity. Nat Rev Neurosci 14, 755–769 (2013).</p> <div class="custom-block note"><p class="custom-block-title">相关阅读</p> <p>微信公众号：<a href="https://mp.weixin.qq.com/s/TDpEVEU16ajN14MuY-6Uvg" target="_blank" rel="noopener noreferrer">文献阅读 | Nature | 新皮质投射神经元规范，发育和多样性的分子逻辑<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></div> <p><strong>作者介绍：</strong></p> <table><thead><tr><th style="text-align:center;">Jeffrey D. Macklis</th></tr></thead> <tbody><tr><td style="text-align:center;"><img src="https://www.hsci.harvard.edu/sites/projects.iq.harvard.edu/files/styles/profile_full/public/hsci/files/macklis_jeff_hscrb_400x480.png?m=1588282592&amp;itok=b6L8L-zI" height="200"></td></tr> <tr><td style="text-align:center;">美国哈佛大学</td></tr> <tr><td style="text-align:center;"><a href="mailto:jeffrey_macklis@harvard.edu">jeffrey_macklis@harvard.edu</a></td></tr></tbody></table> <h2 id="abstract"><a href="#abstract" class="header-anchor">#</a> Abstract</h2> <p>新皮层的精密神经环路由发育过程中在精确分子调控下产生的多种神经元亚型组装而成。近年来，研究人员已鉴定出调控新皮层投射神经元特化与分化的若干关键因子。本研究深入揭示了皮层发育的&quot;分子逻辑&quot;，并进一步支持以下模型：个体祖细胞阶段和有丝分裂后调控因子被嵌入高度互联的网络中，共同调控连续的发育决策。本文系统整合了指导新皮层投射神经元亚型与区域身份渐进式发育和分界的分子调控机制。</p></div></div>  <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=%E7%A5%9E%E7%BB%8F%E7%94%9F%E7%89%A9%E5%AD%A6-%E7%BB%BC%E8%BF%B0" title="标签">#神经生物学-综述</a></div> <div class="last-updated"><span class="prefix">更新时间:<
