DOI: <a href="https://doi.org/10.1002/imt2.5" target="_blank" rel="noopener noreferrer">https://doi.org/10.1002/imt2.5<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>
Cite: Chen T, Liu YX, Huang L. ImageGP: An easy-to-use data visualization web server for scientific researchers. Imeta. 2022;1(1):e5. Published 2022 Feb 21.</p> <div class="custom-block note"><p class="custom-block-title">相关阅读</p> <p>微信公众号：<a href="https://mp.weixin.qq.com/s/cO-pXo1pq8J4FdxkA1vH9w?token=1734217187&amp;lang=zh_CN" target="_blank" rel="noopener noreferrer">文献阅读 | PLoS ONE | SRplot：一个免费的在线平台，用于数据可视化和图形<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></div> <p><strong>作者介绍：</strong></p> <table><thead><tr><th style="text-align:center;">Yewei Wang</th></tr></thead> <tbody><tr><td style="text-align:center;"><img src="" width="200"></td></tr> <tr><td style="text-align:center;">中南大学湘雅二医院</td></tr> <tr><td style="text-align:center;"><a href="mailto:wangyewei@csu.edu.cn">wangyewei@csu.edu.cn</a></td></tr></tbody></table> <h2 id="abstract"><a href="#abstract" class="header-anchor">#</a> Abstract</h2> <p>数据可视化在展示研究成果和促进科研人员知识共享方面具有关键作用。尽管现有多种可视化工具被广泛使用，但大多数工具或需要足够的编程经验，或仅限于特定用途，或属于付费软件。为此，作者推出 ImageGP，一个专为生物和化学数据可视化设计的平台。ImageGP 通过用户友好界面，能用最常见的输入数据生成折线图、柱状图、散点图、箱线图、集合图、热图和直方图等通用图表。通常只需点击几次鼠标即可完成绘图，部分图表仅需粘贴数据并提交即可获取可视化结果。此外，ImageGP 提供多达 26 项参数以满足定制化需求，还包含火山图、功能富集图等组学分析专用图表，以及四种微生物组分析专项功能。自 2017 年上线以来，ImageGP 已持续运行近五年，为全球用户提供 336,951 次访问服务。总之，ImageGP (<a href="http://www.ehbio.com/ImageGP/" target="_blank" rel="noopener noreferrer">http://www.ehbio.com/ImageGP/<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>) 是对于实验研究者全面可视化与解读湿实验和干实验数据的有效工具。</p></div></div>  <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=%E7%94%9F%E7%89%A9%E4%BF%A1%E6%81%AF%E5%AD%A6-%E5%85%B6%E4%BB%96" title="标签">#生物信息学-其他</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2025/08/28, 17:24:05</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/1073fc/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">文献阅读 | Briefings in Bioinformatics | Hiplot：全面且易于使用的生物医学可视化分析平台</div></a> <a href="/pages/35ae94/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">文献阅读 | iMeta | ImageGP 2 用于增强生物医学研究中的数据可视化和可重现分析</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
