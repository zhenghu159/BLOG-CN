DOI: <a href="https://doi.org/10.1038/s41467-023-43220-3" target="_blank" rel="noopener noreferrer">https://doi.org/10.1038/s41467-023-43220-3<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>
Cite: Xu, H., Wang, S., Fang, M. et al. SPACEL: deep learning-based characterization of spatial transcriptome architectures. Nat Commun 14, 7603 (2023).</p> <div class="custom-block note"><p class="custom-block-title">相关阅读</p> <p>微信公众号：<a href="https://mp.weixin.qq.com/s?__biz=MzkwMjM0MzA5MA==&amp;mid=2247487567&amp;idx=1&amp;sn=dfd4b8bb6b141781788ae8631c496a86&amp;chksm=c0a7a092f7d02984e69ab52ee802e65a9efdf978ecd3fec5f540ea876a6067f3cd5285cfd3ba&amp;scene=178&amp;cur_album_id=3049781140582301701#rd" target="_blank" rel="noopener noreferrer">文献阅读：SPACEL：基于深度学习的空间转录组结构表征<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></div> <p><strong>作者介绍：</strong></p> <table><thead><tr><th style="text-align:center;">瞿昆</th></tr></thead> <tbody><tr><td style="text-align:center;"><img src="http://jcyx.ustc.edu.cn/_upload/article/images/98/e7/b5f2b7524ecc95a13264a819b160/f8d7a581-a9a7-4eab-8e04-36ab469e3dad.png" width="200"></td></tr> <tr><td style="text-align:center;">中国科学技术大学</td></tr> <tr><td style="text-align:center;"><a href="mailto:qukun@ustc.edu.cn">qukun@ustc.edu.cn</a></td></tr></tbody></table> <h2 id="abstract"><a href="#abstract" class="header-anchor">#</a> Abstract</h2> <p>空间转录组学（ST）技术可以检测单个 cells/spots 中的 mRNA 表达，同时保留它们的二维（2D）空间坐标，使研究人员能够研究组织中转录组的空间分布；然而，联合分析多个 ST 切片并将它们对齐以构建组织的三维（3D）堆叠仍然是一个挑战。在这里，作者介绍了用于 ST 数据分析的空间结构特征化深度学习（SPACEL）。SPACEL 包括三个模块：Spoint 嵌入了一个带有概率模型的多层感知器，用于对单个 ST 切片中每个 spot 的细胞类型组成进行反卷积；Splane 采用了图卷积网络方法和对抗性学习算法来识别跨多个 ST 切片上转录组和空间上一致的空间域；Scube 自动转换连续切片的空间坐标系统，并将它们叠加在一起以构建组织的三维结构。使用来自各种组织的模拟和真实 ST 数据集和 ST 技术与 19 种最先进的方法进行比较，表明 SPACEL 在细胞类型反卷积、空间域识别和 3D 对齐方面优于其他方法，从而展示了 SPACEL 作为一种用于 ST 数据处理和分析的有价值的集成工具包。</p></div></div>  <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=%E7%94%9F%E7%89%A9%E4%BF%A1%E6%81%AF%E5%AD%A6" title="标签">#生物信息学</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2025/03/08, 17:23:24</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4e9e41/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">文献阅读 | Nature Machine Intelligence | Construction of a 3D whole organism spatial atlas by joint modelling of multiple slices with deep neural networks</div></a> <a href="/pages/32a729/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">文献阅读 --- The tidyomics ecosystem：enhancing omic data analyses</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
