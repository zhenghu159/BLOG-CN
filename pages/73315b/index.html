DOI: <a href="https://doi.org/10.1038/s41596-020-0292-x" target="_blank" rel="noopener noreferrer">https://doi.org/10.1038/s41596-020-0292-x<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>
Cite: Efremova, M., Vento-Tormo, M., Teichmann, S.A. et al. CellPhoneDB: inferring cell–cell communication from combined expression of multi-subunit ligand–receptor complexes. Nat Protoc 15, 1484–1506 (2020).</p> <div class="custom-block note"><p class="custom-block-title">相关阅读</p> <p>微信公众号：<a href="https://mp.weixin.qq.com/s/MTdtQ0PKVyiOkbyTB4H-4A?token=1276314873&amp;lang=zh_CN" target="_blank" rel="noopener noreferrer">文献阅读 | Nature Protocols | CellPhoneDB：从多亚基配体-受体复合物的组合表达推断细胞间通讯<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></div> <p><strong>作者介绍：</strong></p> <table><thead><tr><th style="text-align:center;">Roser Vento-Tormo</th></tr></thead> <tbody><tr><td style="text-align:center;"><img src="https://www.sanger.ac.uk/userpics/800/rv4.jpg" width="200"></td></tr> <tr><td style="text-align:center;">英国威康桑格Sanger研究所</td></tr> <tr><td style="text-align:center;"><a href="mailto:rv4@sanger.ac.uk">rv4@sanger.ac.uk</a></td></tr></tbody></table> <h2 id="abstract"><a href="#abstract" class="header-anchor">#</a> Abstract</h2> <p>由配体-受体复合物介导的细胞间通讯对于协调发育、分化和炎症等多种生物学过程至关重要。为了研究不同细胞类型在特定情境下的相互串扰如何使生理过程得以进行，作者开发了 CellPhoneDB，一个包含配体、受体及其相互作用的新型数据库。与其他数据库不同，作者的数据库同时考虑了配体和受体的亚基结构，能够准确表示异源多聚体复合物。作者将这一资源与一个统计框架相结合，该框架可从单细胞转录组数据中预测两种细胞类型之间富集的细胞相互作用。在此，作者概述了数据库的结构和内容，提供了从单细胞 RNA 测序数据推断细胞间通讯网络的流程，并给出了一个实用的分步指南以帮助实施该方案。CellPhoneDB v.2.0 是资源的更新版本，它增加了新功能，允许用户引入新的相互作用分子，并减少了查询大型数据集所需的时间和资源。CellPhoneDB v.2.0 已公开可用，既提供代码形式，也提供用户友好的网络界面；无论是专家还是计算基因组学经验有限的研究人员均可使用。在作者的方案中，演示了如何使用已发表的数据集通过 CellPhoneDB v.2.0 评估有意义的生物相互作用。对于一个约 10 GB、包含 10,000 个细胞和 19 种细胞类型的数据集，使用五个线程，从安装到统计分析和可视化，该方案通常需要约 2 小时完成。</p></div></div>  <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=%E7%94%9F%E7%89%A9%E4%BF%A1%E6%81%AF%E5%AD%A6-%E5%8D%95%E7%BB%86%E8%83%9E%E7%A9%BA%E9%97%B4%E7%BB%84" title="标签">#生物信息学-单细胞空间组</a></div> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/d26f9e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">文献阅读 --- Comprehensive Integration of Single-Cell Data</div></a> <a href="/pages/c34d2c/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">文献阅读 --- GCNG：graph convolutional networks for inferring gene interaction from spatial transcriptomics data</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
